<!-- أيقونة ملفّ ص — القوس الخالص (فيروزيّ + مؤشّر ذهبيّ).
     إزاحة لون مقصودة عن شعار الهوية القانونيّ (mihrab-mark-dark.svg = #31A796):
     الفيروزيّ هنا أفتح قليلًا (#35B0A0) والخطّ أعرض (8) ليقرأ القوس بوضوح في حجم
     شجرة المستكشف الصغير. المؤشّر #E3BE68 مطابق للشعار. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 128" width="100" height="128">
  <path d="M22 116 L22 58 A56 56 0 0 1 50 8 A56 56 0 0 1 78 58 L78 116"
        fill="none" stroke="#35B0A0" stroke-width="8" stroke-linecap="round"/>
  <rect x="45" y="80" width="10" height="32" rx="5" fill="#E3BE68"/>
</svg>
