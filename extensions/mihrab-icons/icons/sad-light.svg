<!-- أيقونة ملفّ ص — نسخة للأرضيّة الفاتحة (فيروزيّ أغمق + مؤشّر ذهبيّ أغمق للتباين).
     إزاحة لون مقصودة عن شعار الهوية الفاتح القانونيّ (#127C6E فيروزيّ، #C79A3E مؤشّر):
     هنا #2A8577 / #B0791A لرفع التباين على أرضيّة المستكشف الفاتحة في الحجم الصغير. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 128" width="100" height="128">
  <path d="M22 116 L22 58 A56 56 0 0 1 50 8 A56 56 0 0 1 78 58 L78 116"
        fill="none" stroke="#2A8577" stroke-width="8" stroke-linecap="round"/>
  <rect x="45" y="80" width="10" height="32" rx="5" fill="#B0791A"/>
</svg>
