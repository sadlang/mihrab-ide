# ═══════════════════════════════════════════════════════════════════════════
#  مصدر حقيقة عقد سلك نِبراس لمحراب  (Mihrab · Nebras wire-contract SoT)
# ═══════════════════════════════════════════════════════════════════════════
#
#  هذا الملفّ هو المصدر الوحيد لثوابت عقد السلك التي «تعكس @nebras/protocol».
#  الامتداد CommonJS خارج شجرة بناء TypeScript فلا يستورد الحزمة؛ فبدل إعادة
#  إعلان القيم يدويًّا في كلّ ملفّ (خطر تباعد صامت — F1)، تُولَّد وحدة واحدة
#  محلّيّة منه: `protocol-contract.generated.js`.
#
#  السير:  حرِّر هذا الملفّ ⇐ `python contract/gen_contract.py`  (يولّد الوحدة)
#          الحارس:  `python contract/gen_contract.py --check`  (في tests/run.sh)
#
#  التوسّع:  إضافة ثابت = سطر `entry` جديد؛ إضافة قِسم = `group` جديدة.
#           لا تُحرِّر الوحدة المولَّدة يدويًّا — حرِّر هنا وأعِد التوليد.
#
#  ملاحظة تعريب:  القيم العربيّة (أصناف المهامّ/الأدوار/الحصائل/وسائط CLI) جزءٌ
#           من العقد ذاته (لغة ص عربيّة) لا نصّ واجهة — تطابقها الحرفيّ مع الخادم
#           إلزاميّ، فهي بيانات عقد لا سلاسل قابلة للترجمة.

contract: nebras-protocol

groups:
  - name: protocol
    doc: نسخة العقد (SemVer) — تُرسَل في المصافحة Initialize.
    entries:
      - { const: PROTOCOL_VERSION, value: "0.1.0" }

  - name: methods
    doc: طرائق JSON-RPC (client→server ما لم يُذكر خلافه).
    entries:
      - { const: METHOD_INITIALIZE,         value: "nebras/initialize" }
      - { const: METHOD_TASK,               value: "nebras/task" }
      - { const: METHOD_TASK_PROGRESS,      value: "nebras/taskProgress",     doc: "server→client (بثّ)." }
      - { const: METHOD_REQUEST_PERMISSION, value: "nebras/requestPermission", doc: "server→client (طلب موافقة، معرّفات سالبة)." }
      - { const: METHOD_CANCEL,             value: "nebras/cancel" }
      - { const: METHOD_SHUTDOWN,           value: "nebras/shutdown" }

  - name: jsonrpc
    doc: ثوابت JSON-RPC 2.0 القياسيّة (تطابق ErrorCode في العقد) — لا أرقام سحريّة.
    entries:
      - { const: JSONRPC_VERSION,           value: "2.0" }
      - { const: JSONRPC_METHOD_NOT_FOUND,  value: -32601 }
      - { const: JSONRPC_INTERNAL_ERROR,    value: -32603 }

  - name: framing
    doc: تأطير Content-Length عبر stdio (بايتات UTF-8، لا أحرف) — يطابق core/server/stdio.
    entries:
      - { const: CONTENT_LENGTH,  value: "Content-Length" }
      - { const: HEADER_SEP,      value: "\r\n\r\n" }
      - { const: MAX_FRAME_BYTES, value: 8388608, doc: "سقف الإطار الواحد = 8 ميغابايت (حماية ذاكرة)." }

  - name: tasks
    doc: أصناف المهامّ (TaskKind) — قيم عربيّة عقديّة تطابق الخادم حرفيًّا.
    entries:
      - { const: TASK_EXPLAIN,  value: "اشرح" }
      - { const: TASK_AGENT,    value: "وكيل" }
      - { const: TASK_COMPLETE, value: "أكمل", doc: "طبقة خفيفة — تُشحَن خادميًّا لاحقًا." }

  - name: roles
    doc: أدوار المحادثة (ROLE_*) — تُمرَّر مع كلّ مهمّة (الخادم عديم الحالة).
    entries:
      - { const: ROLE_USER,      value: "مستخدم" }
      - { const: ROLE_ASSISTANT, value: "مساعد" }

  - name: outcomes
    doc: وسوم حصيلة خطوة الوكيل (OUTCOME_*) — يعرضها الخادم في بثّ التقدّم.
    entries:
      - { const: OUTCOME_APPLIED, value: "طُبِّق" }
      - { const: OUTCOME_DENIED,  value: "مرفوض" }
      - { const: OUTCOME_PENDING, value: "معلّق" }

  - name: cli
    doc: وسائط تشغيل الخادم المرجعيّ — تطابق واجهة نِبراس السطريّة (`nebras خادم --نقل stdio`).
    entries:
      - { const: SERVE_COMMAND,   value: "خادم" }
      - { const: TRANSPORT_FLAG,  value: "--نقل" }
      - { const: TRANSPORT_STDIO, value: "stdio" }
