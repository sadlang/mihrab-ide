# CI محراب — م0: فحوص هيكليّة خفيفة. البناء الكامل (VSCodium) يأتي كوظيفة منفصلة
# لاحقًا (يحتاج عتادًا ضخمًا و≥30GB)؛ هنا نتحقّق من سلامة الهيكل والتثبيت فقط.
name: فحص الهيكل

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    name: تحقّق هيكل م0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تحقّق صحّة upstream.json
        run: |
          python3 -c "import json,sys; d=json.load(open('upstream.json')); \
            assert d['vscodium']['tag'], 'tag مفقود'; \
            assert d['vscodium']['repo'].startswith('https://'), 'repo غير صالح'; \
            print('✅ تثبيت المنبع صالح:', d['vscodium']['tag'])"

      - name: تحقّق وجود ملفّات الأساس
        run: |
          for f in README.md LICENSE upstream.json build/README.md \
                   build/prepare.sh build/prepare.ps1 build/build.sh \
                   build/patch_node_gyp_spectre.py build/patch_npmrc_tolerance.py \
                   patches/README.md product-overrides/README.md \
                   docs/architecture/three-layer-model.md docs/milestones.md; do
            test -f "$f" || { echo "❌ مفقود: $f"; exit 1; }
          done
          echo "✅ كل ملفّات أساس م0 موجودة."

      - name: فحص صياغة سكربت البناء (bash) + سكربتات الترقيع (python)
        run: |
          bash -n build/build.sh && echo "✅ build.sh سليم نحويًّا."
          python3 -m py_compile build/patch_node_gyp_spectre.py build/patch_npmrc_tolerance.py \
            && echo "✅ سكربتات الترقيع سليمة."

      - name: فحص صياغة سكربت التحضير (bash)
        run: bash -n build/prepare.sh && echo "✅ prepare.sh سليم نحويًّا."

      - name: مؤشّر صحّة — عدّ رُقَع الطبقة الثالثة
        run: |
          count=$(find patches -name '*.patch' | wc -l)
          echo "📊 رُقَع النواة (الطبقة الثالثة): $count"
          echo "   (م0 يبدأ بصفر؛ ارتفاعه = ارتفاع دَيْن الدمج.)"

  patch-layer:
    name: طبقة الرقعة (L0 ساكن + L1 مراسي)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # L0 — فحص ساكن: صياغة المرقِّعات، بنية FILES، JSON، مانيفست حزمة اللغة، lint CSS.
      - name: L0 — فحص ساكن لطبقة الرقعة
        run: python tests/static/lint_patchers.py

      # L1 — تطبيق المراسي على لقطة المنبع المثبَّتة (fixture مُلتزَمة؛ لا يحتاج تحضير VSCode).
      #      يمسك انجراف المراسي فورًا بدل فشل بناء صامت بعد ~20 د.
      - name: L1 — تطبيق مراسي الرُقَع على لقطة المنبع
        env:
          MIHRAB_L1_SOURCE: snapshot
        run: python tests/apply/check_anchors.py

  extension-checks:
    name: امتدادات محراب (حارس عقد السلك + اختبارات الوحدة)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت PyYAML (تبعيّة مولِّد عقد السلك)
        run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # F1 — حارس: وحدة عقد السلك المولَّدة مطابقة لمصدر الحقيقة (يمنع التباعد الصامت).
      - name: حارس تطابق عقد سلك نِبراس
        run: python extensions/mihrab-nebras/contract/gen_contract.py --check

      # F2 — اختبارات وحدة نِبراس (تأطير RPC/توجيه/dispose + تفاوض isCompatible).
      - name: اختبارات وحدة نِبراس
        working-directory: extensions/mihrab-nebras
        run: node --test

      # اختبارات وحدة الترحيب (تحقّق اسم المشروع — منطق نقيّ بلا vscode).
      - name: اختبارات وحدة الترحيب
        working-directory: extensions/mihrab-welcome
        run: node --test
